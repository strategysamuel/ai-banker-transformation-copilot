name: Build and deploy Cloud Run candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server.ts'
      - 'server/**'
      - 'src/data/projectCompassData.ts'
      - 'scripts/test-phase3c-governance.ts'
      - 'package.json'
      - 'bun.lockb'
      - 'bun.lock'
      - 'Dockerfile'
      - '.github/workflows/cloud-run-candidate.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production-candidate
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: gen-lang-client-0113378314
  GCP_REGION: us-west1
  CLOUD_RUN_SERVICE: ai-banker-transformation-copilot
  ARTIFACT_REPOSITORY: ai-banker-copilot
  IMAGE_NAME: app

jobs:
  verify-and-deploy-candidate:
    runs-on: ubuntu-latest
    environment: production-candidate
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --no-save --no-frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Run Firebase authentication tests
        run: bun run test:auth

      - name: Run Project Compass governance tests
        run: bun run test:project-compass-governance

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firestore security rules tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-ai-banker "bun run test:firestore-rules"

      - name: Build application
        run: bun run build

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push immutable image
        id: image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"
          docker build --pull --platform linux/amd64 --tag "${IMAGE}" .
          docker push "${IMAGE}"
          echo "uri=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Snapshot current production traffic allocation
        run: |
          set -euo pipefail
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json > /tmp/cloud-run-before.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/cloud-run-before.json"))
          traffic=d.get("status",{}).get("traffic",[])
          production=[{"revisionName":t.get("revisionName"),"percent":t.get("percent",0)}
                      for t in traffic if not t.get("tag") and t.get("percent",0)>0]
          if not production:
              raise SystemExit("Could not identify current production traffic allocation; refusing candidate deployment.")
          json.dump(production, open("/tmp/production-traffic-before.json","w"), sort_keys=True)
          print("Production traffic before candidate:", production)
          PY

      - name: Deploy isolated candidate revision without shifting production traffic
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          # Export the current service, replace the source-build placeholder
          # with the immutable container image, and remove source metadata.
          # Add a zero-percent tagged target for the newly-created revision;
          # retain the existing production revision at 100%.
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=export > /tmp/candidate-service.yaml
          python - <<'PY'
          import json, os, yaml
          path="/tmp/candidate-service.yaml"
          live=json.load(open("/tmp/cloud-run-before.json"))
          with open(path) as f:
              service=yaml.safe_load(f)
          service.setdefault("metadata",{}).setdefault("annotations",{}).pop("run.googleapis.com/sources",None)
          template=service.setdefault("spec",{}).setdefault("template",{})
          template.setdefault("metadata",{}).setdefault("annotations",{}).pop("run.googleapis.com/sources",None)
          containers=template.get("spec",{}).get("containers",[])
          if not containers:
              raise SystemExit("Cloud Run service export has no container; refusing deployment.")
          containers[0]["image"]=os.environ["IMAGE_URI"]
          production=[]
          for item in live.get("status",{}).get("traffic",[]):
              if item.get("tag") or not item.get("percent",0):
                  continue
              if not item.get("revisionName"):
                  raise SystemExit("Production traffic target is not pinned to a revision; refusing deployment.")
              production.append({"revisionName":item["revisionName"],"percent":item["percent"]})
          if not production or sum(x["percent"] for x in production)!=100:
              raise SystemExit("Could not preserve a complete 100% production traffic allocation; refusing deployment.")
          service.setdefault("spec",{})["traffic"]=production+[{"latestRevision":True,"percent":0,"tag":"github-candidate"}]
          with open(path,"w") as f:
              yaml.safe_dump(service,f,sort_keys=False)
          print("Prepared candidate service spec; production allocation preserved:",production)
          print("New latest revision will receive the github-candidate tag at 0% production traffic.")
          PY
          gcloud run services replace /tmp/candidate-service.yaml \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --quiet

      - name: Resolve candidate URL and smoke-test health endpoint
        id: smoke
        run: |
          set -euo pipefail
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json > /tmp/cloud-run-service.json

          CANDIDATE_URL="$(python -c 'import json; d=json.load(open("/tmp/cloud-run-service.json")); matches=[t for t in d.get("status",{}).get("traffic",[]) if t.get("tag")=="github-candidate"]; print(matches[0].get("url","") if matches else "")')"
          if [ -z "${CANDIDATE_URL}" ]; then
            echo "Could not resolve the github-candidate tagged URL." >&2
            exit 1
          fi

          echo "url=${CANDIDATE_URL}" >> "${GITHUB_OUTPUT}"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "${CANDIDATE_URL}/api/health" -o /tmp/candidate-health.json
          python - <<'PY'
          import json
          health=json.load(open("/tmp/candidate-health.json"))
          expected={
            "status":"healthy",
            "service":"ai-banker-transformation-copilot",
            "env":"production",
            "phase":"Phase 3D - Project Compass Citation Integrity & Governance Validation Live",
          }
          for key,value in expected.items():
              if health.get(key)!=value:
                  raise SystemExit(f"Candidate health mismatch for {key}: expected {value!r}, got {health.get(key)!r}")
          print("Candidate health validated:", expected)
          PY

          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json > /tmp/cloud-run-after.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/cloud-run-after.json"))
          traffic=d.get("status",{}).get("traffic",[])
          production=[{"revisionName":t.get("revisionName"),"percent":t.get("percent",0)}
                      for t in traffic if not t.get("tag") and t.get("percent",0)>0]
          before=json.load(open("/tmp/production-traffic-before.json"))
          if sorted(production,key=lambda x:(x["revisionName"] or "",x["percent"])) != sorted(before,key=lambda x:(x["revisionName"] or "",x["percent"])):
              raise SystemExit(f"Production traffic changed unexpectedly. Before={before}; after={production}")
          print("Production traffic allocation unchanged:", production)
          PY

      - name: Publish candidate deployment summary
        if: always()
        run: |
          {
            echo "## Cloud Run candidate deployment"
            echo "- Project: ${GCP_PROJECT_ID}"
            echo "- Region: ${GCP_REGION}"
            echo "- Service: ${CLOUD_RUN_SERVICE}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Production traffic: unchanged by this workflow"
            if [ -n "${{ steps.smoke.outputs.url }}" ]; then
              echo "- Candidate URL: ${{ steps.smoke.outputs.url }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
