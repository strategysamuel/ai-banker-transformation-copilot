name: Firestore Security Rules

on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.ts'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'
  push:
    branches: [security/firestore-profile-integrity]
    paths:
      - 'firestore.rules'
      - 'tests/firestore.rules.test.ts'
      - 'firebase.json'
      - 'package.json'
      - '.github/workflows/firestore-rules.yml'

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run Firestore emulator security tests
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-ai-banker "npm run test:firestore-rules"
