name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who experiences this problem, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and banking-governance considerations
      description: Use synthetic examples only. Do not include confidential data.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How could this be tested?
    validations:
      required: true
